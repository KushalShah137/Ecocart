{% extends 'base.html' %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="container section">
  <div class="auth-box card"><div class="card-body" style="padding:1.75rem">
    <h1 style="font-size:1.6rem">Create your account</h1>
    <form method="post" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field"><label for="n">Full name</label><input id="n" type="text" name="full_name" value="{{ form.full_name or '' }}" required minlength="2" maxlength="120" autocomplete="name"></div>
      <div class="field"><label for="e">E-mail</label><input id="e" type="email" name="email" value="{{ form.email or '' }}" required autocomplete="email"></div>
      <div class="form-row">
        <div class="field"><label for="ph">Phone (optional)</label><input id="ph" type="tel" name="phone" value="{{ form.phone or '' }}" maxlength="20"></div>
        <div class="field"><label for="c">City (optional)</label><input id="c" type="text" name="city" value="{{ form.city or '' }}" maxlength="80"></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="p1">Password</label><input id="p1" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
        <div class="field"><label for="p2">Confirm password</label><input id="p2" type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
      </div>
      <p class="tiny muted">At least 8 characters with letters and numbers. Stored as a scrypt hash.</p>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
    </form>
    <p class="small" style="margin-top:1rem">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
  </div></div>
</div>
{% endblock %}
